  <script>
  (function() {
      var images = ["travel/DSC07393.JPG","travel/DSC07395.JPG","travel/DSC07400.JPG","travel/DSC07413.JPG","travel/DSC07414.JPG","travel/DSC07415.JPG","travel/DSC07416.JPG","travel/DSC07417.JPG","travel/DSC07418.JPG","travel/DSC07419.JPG","travel/DSC07420.JPG","travel/DSC07421.JPG","travel/DSC07422.JPG","travel/DSC07423.JPG","travel/DSC07424.JPG","travel/DSC07425.JPG","travel/DSC07426.JPG","travel/DSC07427.JPG","travel/DSC07428.JPG","travel/DSC07429.JPG","travel/DSC07431.JPG","travel/DSC07432.JPG","travel/DSC07433.JPG","travel/DSC07434.JPG","travel/DSC07435.JPG","travel/DSC07436.JPG","travel/DSC07437.JPG","travel/DSC07438.JPG","travel/DSC07439.JPG","travel/DSC07440.JPG","travel/DSC07441.JPG","travel/DSC07442.JPG","travel/DSC07443.JPG","travel/DSC07444.JPG","travel/DSC07445.JPG"];
      var currentIndex = 0;
      var currentZoom = 1;
      var zoomStep = 0.25;
      var minZoom = 0.25;
      var maxZoom = 5;

      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightboxImg');
      var lightboxImgWrap = document.getElementById('lightboxImgWrap');
      var lightboxCounter = document.getElementById('lightboxCounter');
      var zoomLevelEl = document.getElementById('zoomLevel');

      var items = document.querySelectorAll('.gallery-item');
      items.forEach(function(item) {
          item.addEventListener('click', function() {
              var idx = parseInt(this.getAttribute('data-index'), 10);
              openLightbox(idx);
          });
      });

      function openLightbox(index) {
          currentIndex = index;
          currentZoom = 1;
          applyZoom();
          lightboxImg.src = images[currentIndex];
          lightboxImg.alt = 'photo ' + (currentIndex + 1);
          lightbox.classList.add('active');
          updateCounter();
          document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
      }

      function prevImage() {
          currentIndex = (currentIndex - 1 + images.length) % images.length;
          resetZoom();
          lightboxImg.src = images[currentIndex];
          updateCounter();
      }

      function nextImage() {
          currentIndex = (currentIndex + 1) % images.length;
          resetZoom();
          lightboxImg.src = images[currentIndex];
          updateCounter();
      }

      function zoomIn() {
          currentZoom = Math.min(currentZoom + zoomStep, maxZoom);
          applyZoom();
          updateZoomLabel();
      }

      function zoomOut() {
          currentZoom = Math.max(currentZoom - zoomStep, minZoom);
          applyZoom();
          updateZoomLabel();
      }

      function resetZoom() {
          currentZoom = 1;
          applyZoom();
          updateZoomLabel();
      }

      function applyZoom() {
          lightboxImg.style.transform = 'scale(' + currentZoom + ')';
      }

      function updateCounter() {
          lightboxCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
      }

      function updateZoomLabel() {
          zoomLevelEl.textContent = Math.round(currentZoom * 100) + '%';
      }

      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      document.getElementById('lightboxPrev').addEventListener('click', prevImage);
      document.getElementById('lightboxNext').addEventListener('click', nextImage);
      document.getElementById('btnZoomIn').addEventListener('click', zoomIn);
      document.getElementById('btnZoomOut').addEventListener('click', zoomOut);
      document.getElementById('btnZoomReset').addEventListener('click', resetZoom);

      lightbox.addEventListener('click', function(e) {
          if (e.target === lightbox) closeLightbox();
      });

      lightboxImgWrap.addEventListener('wheel', function(e) {
          e.preventDefault();
          if (e.deltaY < 0) zoomIn();
          else zoomOut();
      }, { passive: false });

      document.addEventListener('keydown', function(e) {
          if (!lightbox.classList.contains('active')) return;
          switch (e.key) {
              case 'Escape':   closeLightbox(); break;
              case 'ArrowLeft':  prevImage(); break;
              case 'ArrowRight': nextImage(); break;
              case '+': case '=': zoomIn(); break;
              case '-': zoomOut(); break;
              case '0': resetZoom(); break;
          }
      });

      (function() {
          var initialDistance = 0;
          var initialZoom = 1;

          lightboxImgWrap.addEventListener('touchstart', function(e) {
              if (e.touches.length === 2) {
                  initialDistance = getTouchDistance(e.touches);
                  initialZoom = currentZoom;
              }
          }, { passive: true });

          lightboxImgWrap.addEventListener('touchmove', function(e) {
              if (e.touches.length === 2) {
                  e.preventDefault();
                  var newDistance = getTouchDistance(e.touches);
                  var scale = newDistance / initialDistance;
                  currentZoom = Math.max(minZoom, Math.min(maxZoom, initialZoom * scale));
                  applyZoom();
                  updateZoomLabel();
              }
          }, { passive: false });

          function getTouchDistance(touches) {
              var dx = touches[0].clientX - touches[1].clientX;
              var dy = touches[0].clientY - touches[1].clientY;
              return Math.sqrt(dx * dx + dy * dy);
          }
      })();

  })();
  </script>
